name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Audit
        run: make audit

      - name: Unit tests
        run: make test

      - name: End-to-end tests
        run: make e2e

      - name: Container logs
        if: failure()
        run: docker compose logs
